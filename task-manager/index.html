<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
  </head>
  <body class="min-h-screen bg-gray-100 p-8">
    <main class="mx-auto max-w-3xl">
      <h1 class="mb-8 text-4xl font-bold">Task Manager</h1>

      <form id="task-form" class="mb-8 flex gap-3">
        <div class="flex flex-col">
          <input
            id="task-input"
            type="text"
            placeholder="Enter a task..."
            class="w-150 rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none focus:ring-2"
          />
          <span id="task-error" class="px-2 hidden text-sm text-red-500"></span>
        </div>

        <div>
          <button
            type="submit"
            class="rounded-lg bg-black px-6 py-3 font-medium text-white"
          >
            Add Task
          </button>
        </div>
      </form>

      <section id="task-list"></section>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
