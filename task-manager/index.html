<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen bg-gray-100 p-8">
    <main class="mx-auto max-w-3xl">
      <h1 class="mb-8 text-4xl font-bold">Task Manager</h1>

      <form id="task-form" class="mb-8 flex gap-3">
        <div class="flex flex-col w-160">
          <input
            id="task-input"
            type="text"
            placeholder="Enter a task..."
            class="rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none focus:ring-2"
          />
          <span id="task-error" class="px-2 hidden text-sm text-red-500"></span>
        </div>

        <div>
          <button
            type="submit"
            class="rounded-lg bg-black px-6 py-3 font-medium text-white cursor-pointer"
          >
            Add Task
          </button>
        </div>
      </form>

      <section class="w-full" id="task-list"></section>
    </main>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
