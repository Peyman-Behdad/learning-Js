<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div
      class="min-h-screen bg-linear-[135deg] from-[#153677] to-[#4e085f] max-w-full flex items-center justify-center"
    >
      <div class="bg-white w-full md:w-100 rounded-lg pb-10 pt-5 px-5">
        <div class="flex items-center">
          <h2 class="text-2xl font-bold">To-Do List</h2>
          <img src="src/assets/images/icon.png" class="w-11" alt="" />
        </div>
        <div
          class="flex items-center justify-between rounded-full bg-[#edeef0] pl-5 mt-5 overflow-hidden"
        >
          <input
            class="flex-1 flex outline-none p-2 font-semibold"
            type="text"
            id="input-box"
            placeholder="Add your task"
          />
          <button
            class="px-10 py-3 bg-[#ff5945] text-white text-lg cursor-pointer rounded-full"
          >
            Add
          </button>
        </div>
        <div class="mt-5">
          <ul id="list-container">
            <li
              class="select-none cursor-pointer text-lg py-3 px-10 before:content-[''] before:absolute before:size-7 before:rounded-full before:bg-cover before:bg-center before:top-3 before:left-2 before:bg-[url(/src/assets/images/uncheked.png)] relative line-through text-[#555]"
            >
              Task 1
            </li>
            <li
              class="select-none cursor-pointer text-lg py-3 px-10 before:content-[''] before:absolute before:size-7 before:rounded-full before:bg-cover before:bg-center before:top-3 before:left-2 before:bg-[url(/src/assets/images/uncheked.png)] relative line-through text-[#555]"
            >
              Task 2
            </li>
            <li
              class="select-none cursor-pointer text-lg py-3 px-10 before:content-[''] before:absolute before:size-7 before:rounded-full before:bg-cover before:bg-center before:top-3 before:left-2 before:bg-[url(/src/assets/images/uncheked.png)] relative line-through text-[#555]"
            >
              Task 3
            </li>
          </ul>
        </div>
      </div>
    </div>
    <script src="src/js/main.js"></script>
  </body>
</html>
