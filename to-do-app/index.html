<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div
      class="min-h-screen bg-linear-[135deg] from-[#153677] to-[#4e085f] max-w-full flex items-center justify-center"
    >
      <div class="bg-white w-full md:w-100 rounded-lg pb-10 pt-5 px-5">
        <div class="flex items-center">
          <h2 class="text-2xl font-bold">To-Do List</h2>
          <img src="src/assets/images/icon.png" class="w-11" alt="" />
        </div>
        <div
          class="flex items-center justify-between rounded-full bg-[#edeef0] pl-5 mt-5 overflow-hidden"
        >
          <input
            class="input-box flex-1 flex outline-none p-2 font-semibold"
            type="text"
            placeholder="Add your task"
          />
          <button
            onclick="addTask()"
            class="task-btn px-10 py-3 bg-[#ff5945] text-white text-lg cursor-pointer rounded-full"
          >
            Add
          </button>
        </div>
        <div class="error pt-4 text-red-600 text-sm px-3 hidden">
          <span>You must write something!</span>
        </div>
        <div class="mt-5">
          <ul class="list-container"></ul>
        </div>
      </div>
    </div>
    <script src="src/js/main.js"></script>
  </body>
</html>
